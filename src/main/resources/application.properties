spring.application.name=vancouver-explorer
spring.graphql.graphiql.enabled=true
# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/vancouver_explorer
spring.datasource.username=nam

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migrations
spring.flyway.enabled=true